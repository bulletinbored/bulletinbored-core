# bulletinbored — Nginx configuration
#
# This is a complete Nginx server block for bulletinbored. Adjust the
# server_name, root path, and PHP-FPM socket/port to match your environment.
#
# Save this as /etc/nginx/sites-available/bulletinbored (Debian/Ubuntu) or
# include it in your server block, then enable and reload Nginx.

server {
    listen 80;
    listen [::]:80;
    server_name forum.example.com;

    # Redirect HTTP → HTTPS (uncomment in production with a valid certificate)
    # return 301 https://$host$request_uri;

    root /var/www/bulletinbored;
    index index.php;

    # ---- Security: block access to sensitive paths ----
    # Deny direct access to the data directory (sessions, configs, DB)
    location ^~ /data/ {
        deny all;
        return 403;
    }

    # Deny access to the installer after setup (defense in depth)
    location ~ ^/(install|install2|install3)\.php$ {
        deny all;
        return 403;
    }

    # Deny access to hidden files (.htaccess, .user.ini, .git, etc.)
    location ~ /\. {
        deny all;
        return 403;
    }

    # ---- Pretty URL rewrites (equivalent to the Apache .htaccess) ----
    # Route everything through index.php — the PHP router handles all paths.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- PHP-FPM ----
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;   # Adjust socket/path
        # fastcgi_pass 127.0.0.1:9000;                 # Alternative: TCP
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Required so bootstrap.php detects HTTPS correctly behind a proxy
        fastcgi_param HTTPS $https if_not_empty;
    }

    # ---- Static file caching ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

