name: Database Matrix Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
    name: SQLite (PHP ${{ matrix.php-version }})
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          # The zip extension is required: package/plugin/theme tests skip
          # themselves without ZipArchive, and a skipped security test is a
          # silent hole in the matrix.
          extensions: pdo, pdo_sqlite, zip
      - name: Run tests
        env:
          BB_HTTP_TESTS: '1'
        run: php tests/run.php
      - name: Build the release package
        if: matrix.php-version == '8.3'
        run: php tools/build-release.php --output=dist/bulletinbored-core.zip
      - name: Upload the release package
        if: matrix.php-version == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: bulletinbored-core-package
          path: |
            dist/bulletinbored-core.zip
            dist/bulletinbored-core.zip.sha256

  test-mysql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        mysql-version: ['8.0', '8.4']
    name: MySQL ${{ matrix.mysql-version }} (PHP ${{ matrix.php-version }})
    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bulletinbored_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql, pdo_sqlite, zip
      - name: Run full test suite against the service database
        env:
          BB_HTTP_TESTS: '1'
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: bulletinbored_test
          DB_USER: root
          DB_PASS: root
        run: php tests/run.php

  test-mariadb:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        mariadb-version: ['10.6', '10.11', '11.4']
    name: MariaDB ${{ matrix.mariadb-version }} (PHP ${{ matrix.php-version }})
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb-version }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bulletinbored_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql, pdo_sqlite, zip
      - name: Run full test suite against the service database
        env:
          BB_HTTP_TESTS: '1'
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: bulletinbored_test
          DB_USER: root
          DB_PASS: root
        run: php tests/run.php

  coverage:
    runs-on: ubuntu-latest
    name: Coverage (Xdebug, threshold)
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, zip
          coverage: xdebug
      - name: Run tests with line coverage
        env:
          XDEBUG_MODE: coverage
        # Coverage is measured over src/ (routing, handlers, helpers) and lib/
        # (authorization, sessions, updates, migrations, packages). The
        # threshold is a regression floor, not a target: it currently sits a
        # few points below the measured value so unrelated refactors do not
        # break the build, while a real loss of coverage does.
        run: php tests/run.php --coverage --min-coverage=80
